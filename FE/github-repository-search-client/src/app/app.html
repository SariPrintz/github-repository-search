@if (auth.isAuthenticated()) {
  <div class="authenticated-shell">
    <nav class="top-nav" aria-label="Main navigation">
      <div class="nav-links">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          aria-label="Go to repository search"
        >
          Repository Search
        </a>
        <a
          routerLink="/bookmarks"
          routerLinkActive="active"
          aria-label="Go to bookmarks"
          (click)="logBookmarkNavigation()"
        >
          Bookmarks
        </a>
      </div>

      <button
        type="button"
        class="logout-button"
        (click)="logLogoutState()"
        aria-label="Log out"
      >
        Logout
      </button>
    </nav>

    <div class="user-greeting">
      <p>Welcome, {{ auth.username() }}</p>
    </div>

    <router-outlet />
  </div>
} @else {
  <app-login />
}
